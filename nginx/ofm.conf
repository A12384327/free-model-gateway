# free-model-gateway reverse proxy
#
# Sits in the same container/network namespace as the OFM standalone service,
# which binds 127.0.0.1:18900 by design (isLoopbackHost). nginx is the only
# network-facing door: 0.0.0.0:8123 -> 127.0.0.1:18900.
#
# Two surfaces with different trust shapes (see scripts/preflight.mjs):
#
#  /v1/*  — the OpenAI-compatible API. src/forward.js authenticates a Bearer
#           key and never inspects Host/Origin, so headers pass through as-is.
#           Clients keep their Host header (base URL stays accurate in
#           error messages and the management page's own examples).
#
#  everything else — the management UI ("/", /health, /api/management/*) and
#           the API path aliases the forward listener also serves
#           (/chat/completions, /models, /responses). management.mjs runs
#           structuralRejection() BEFORE its own auth: Host must be loopback
#           and Origin/Referer must be same-origin *or absent*. A browser on
#           the public internet always sends Origin/Referer with the public
#           host, so the proxy must present the loopback shape and strip the
#           browser's origin headers. Stripping (not rewriting) is the safe
#           direction: an absent header never fails the fence, and no forged
#           same-origin header is needed.
#
# SSE: reasoning models can sit silent for minutes while upstream bills
# reasoning tokens (measured: 70s). The service emits ": ping" comment
# frames every 15s; nginx must not buffer them (proxy_buffering off) and
# must not time out mid-thought (proxy_read_timeout 3600s matches the
# service's own 900s total budget with headroom).

server {
    listen 8123;
    server_name _;

    # The management UI's channel-backup import accepts up to 8 MB bodies
    # (management.mjs readBody limit). nginx's default of 1m would 413 the
    # import before upstream ever saw it.
    client_max_body_size 16m;

    # Streaming requests can carry large tool histories too.
    proxy_request_buffering off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # ---- OpenAI API surface: pass through untouched ---------------------
    location /v1/ {
        proxy_pass http://127.0.0.1:18900;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Host/Origin/Referer: passed through (forward.js has no fence)
    }

    # ---- Management surface: rewrite into the loopback shape ------------
    location / {
        proxy_pass http://127.0.0.1:18900;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Fence: Host must resolve as loopback for structuralRejection().
        proxy_set_header Host 127.0.0.1:18900;

        # Fence: Origin/Referer must be same-origin or absent. The browser's
        # origin headers name the public address, which would mismatch the
        # rewritten Host -> 403. Strip them; absent headers pass.
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_set_header Sec-Fetch-Site "";
    }
}
